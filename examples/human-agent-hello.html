<!-- HTML Kernel language: the SAME typed source checks for Linux, kernel, and Ring3. -->
<kernel arch="x86_64">
  <onboot>
    <let name="count" type="u64" value="3"/>
    <repeat times="3">
      <print value="count"/>
    </repeat>
    <print value="4294967296"/>
    <halt/>
  </onboot>
</kernel>
