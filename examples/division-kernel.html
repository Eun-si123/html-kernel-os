<kernel arch="x86_64">
  <function name="quotient" params="x:i32,y:i32" returns="i32">
    <return value="x / y"/>
  </function>
  <onboot>
    <print>Native division in HTML Kernel!</print>
    <let name="a" type="i32" value="-17"/>
    <print value="a / 5"/>
    <print value="a % 5"/>
    <print value="i32(-2147483648) / i32(-1)"/>
    <print value="i32(-2147483648) % i32(-1)"/>
    <print value="u32(4294967295) / u32(2)"/>
    <print value="u32(4294967295) % u32(2)"/>
    <let name="wide" type="u64" value="18446744073709551615"/>
    <print value="wide / 3"/>
    <print value="wide % 3"/>
    <print value="quotient(i32(-21), i32(5))"/>
    <if test="a % 5 == -2">
      <print>division PASS</print>
    </if>
    <halt/>
  </onboot>
</kernel>
