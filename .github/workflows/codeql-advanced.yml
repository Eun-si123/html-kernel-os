name: CodeQL security analysis (kernel, browser, Python and Actions)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '26 3 * * 3'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: htmlk-codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  change-scope:
    name: Change scope (fail open)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify full PR or push change range
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_changed_files.py
  analyze:
    needs: change-scope
    if: needs.change-scope.outputs.heavy == 'true'
    permissions:
      contents: read
      security-events: write
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
          - language: python
          - language: javascript-typescript
          - language: c-cpp
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL (buildless analysis)
        uses: github/codeql-action/init@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql-config.yml
      - name: Analyze source and upload security results
        uses: github/codeql-action/analyze@0911ee96d2d6c8def97122c36c5cadd93829a4b4 # v4
        with:
          category: '/language:${{ matrix.language }}'
