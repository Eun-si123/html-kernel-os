name: Validate prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python unit and static-site tests
        run: python -m unittest discover -s tests -v
      - name: Agent and documentation checks
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/agent_feature_map.py validate
          python scripts/roadmap.py --check
          python scripts/check_docs.py
      - name: Block private credentials in browser source
        run: |
          python3 -m unittest discover -s scripts -p 'test_verify_published_secrets.py' -v
          python3 scripts/verify_published_secrets.py site
      - name: Validate site JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/play.js
      - name: M2-UX human and agent language checker and grammar discovery
        run: |
          python scripts/htmlk_check.py --describe --json | python -m json.tool > /dev/null
          python scripts/htmlk_check.py examples/human-agent-hello.html --target kernel
          python scripts/htmlk_check.py examples/human-agent-hello.html --target linux
          python scripts/htmlk_check.py examples/human-agent-hello.html --target user --json
      - name: M2-UX5 real bounded stdio Language Server Protocol and canonical diagnostics
        run: python -m unittest tests.test_htmlk_lsp -v
      - name: M2-UX6 compiler-derived public language schema and browser read-only reference
        run: |
          mkdir -p build
          python scripts/build_public_language_grammar.py --out build/htmlk-language.json
          node --check site/live/grammar.mjs
          node --test scripts/test_live_grammar.mjs
      - name: M2-UX7-A canonical Python compiler bytes and real browser WASM frontend contract
        run: |
          python -m unittest tests.test_public_browser_compiler -v
          node --check site/live/compiler-worker.mjs
          node --check site/live/compile.mjs
          node --test scripts/test_browser_compiler.mjs
          python scripts/build_public_browser_compiler.py --out-dir build/browser-compiler
      - name: Generate freestanding C
        run: python compiler/htmlk.py examples/kernel.html --out build/kernel.c
      - name: Compile x86-64 object (not a boot image)
        run: |
          gcc -std=c11 -ffreestanding -fno-stack-protector -fno-pie -Wall -Wextra -Werror -c build/kernel.c -o build/kernel.o
          gcc -std=c11 -O2 -ffreestanding -fno-stack-protector -fno-pie -Wall -Wextra -Werror -c build/kernel.c -o build/kernel.opt.o
      - name: Compile and actually execute HTML programs in Linux userspace
        run: python scripts/test_linux.py
      - name: Differential test signed/unsigned arithmetic against Python (UBSan -O0/-O3)
        run: |
          python scripts/test_integer_oracle.py
          python scripts/test_division_oracle.py
      - name: Install real x86 boot-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso tcc
      - name: M2-UX7-B strict native TinyCC HTML proof and multiple real Ring3 QEMU applications
        run: |
          python -m unittest tests.test_tcc_user_backend -v
          python scripts/test_tcc_user_proof.py
      - name: Verify actual Limine RGB framebuffer writes and source-derived pixels in QEMU
        run: python scripts/test_video_console.py
      - name: Verify actual QEMU VGA screenshot shows kernel glyph pixels
        run: python scripts/test_video_screen.py
      - name: Boot and verify HTML-derived kernel in QEMU
        run: python scripts/test_boot.py
      - name: Verify M2 variables and control flow boot
        run: python scripts/test_language_boot.py
      - name: Verify M2 user-defined functions in Linux and native QEMU
        run: python scripts/test_functions.py
      - name: Verify scoped functions in Linux and native QEMU
        run: python scripts/test_scoped_functions.py
      - name: Verify M2 if/else branches in Linux and native QEMU
        run: python scripts/test_else.py
      - name: Verify typed u32/u64 semantics in Linux and native QEMU
        run: python scripts/test_u32.py
      - name: Verify signed integers, safe bitwise and break/continue in Linux and native QEMU
        run: python scripts/test_signed_bits.py
      - name: Verify bounded condition-driven loops in Linux and real QEMU
        run: python scripts/test_while.py
      - name: Verify safe integer division, overflow and zero-fault in Linux and QEMU
        run: python scripts/test_division.py
      - name: Verify checked arrays in Linux and actual BIOS QEMU, including OOB failures
        run: python scripts/test_arrays.py
      - name: Verify M2 five representative beginner tasks in Linux and QEMU
        run: python scripts/test_m2_gate.py
      - name: Verify M3 Limine memory-map, 16 physical page readbacks and malformed map in real QEMU
        run: python scripts/test_m3_memory.py
      - name: Verify real CPU IDT exceptions in BIOS QEMU, normal HTML and map/video composition
        run: python scripts/test_exception_idt.py
      - name: Verify private CR3 4KiB virtual map/unmap and actual post-unmap #PF in QEMU
        run: python scripts/test_paging_probe.py
      - name: Verify frame ownership and real one-shot page fault recovery in BIOS QEMU
        run: python scripts/test_paging_recovery.py
      - name: Verify genuine TSS/IST1 #DF, IST2 #PF and combined recovery boot in QEMU
        run: python scripts/test_tss_ist.py
      - name: Verify bounded 4KiB multi-page aliasing, repeated owner reuse and true revoked-page #PF in QEMU
        run: python scripts/test_multimap.py
      - name: Verify M4 real cooperative kernel tasks and rejected state transitions in QEMU
        run: python scripts/test_m4_tasks.py
      - name: Verify real M4 PIT/PIC IRQ0 pacing, APIC rejection and masked IRQ timeout
        run: python scripts/test_m4_timer.py
      - name: Verify real x2APIC timer preemption of never-yielding ring-0 tasks in QEMU
        run: python scripts/test_m4_preempt.py
      - name: Verify real M4 Ring 3 user-mode syscalls and forbidden CPU memory/IO access in QEMU
        run: python scripts/test_m4_user.py
      - name: Verify M4-C2 actual Ring 3 fault containment across distinct CR3 tasks in QEMU
        run: python scripts/test_m4_isolation.py
      - name: Verify M4-D1 real never-yielding CPL3 x2APIC preemption
        run: python scripts/test_m4_user_preempt.py
      - name: Verify M4-D2 preempted CPL3 fault containment and survivor
        run: python scripts/test_m4_user_fault_preempt.py
      - name: Validate M5-A ROMFS bounds under native UBSan O0/O3
        run: |
          for opt in 0 3; do
            gcc -std=c11 -O${opt} -fsanitize=undefined -fno-sanitize-recover=all -Wall -Wextra -Werror -I boot boot/romfs.c tests/native/test_romfs.c -o build/romfs-test-${opt}
            build/romfs-test-${opt}
          done
      - name: Boot M5-A opt-in immutable filesystem with source mutation and denial oracles
        run: python scripts/test_m5_romfs.py
      - name: Validate bounded M5-B serial command parser under UBSan O0/O3
        run: |
          for opt in 0 3; do
            gcc -std=c11 -O${opt} -fsanitize=undefined -fno-sanitize-recover=all -Wall -Wextra -Werror -I boot boot/serial_command.c boot/romfs.c tests/native/test_serial_command.c -o build/serial-test-${opt}
            build/serial-test-${opt}
          done
      - name: Verify real M5-B QEMU UART RX, ROMFS commands, rejection and source provenance
        run: python scripts/test_m5_console.py
      - name: Validate M5-C1 user executable format under UBSan O0/O3
        run: |
          for opt in 0 3; do
            gcc -std=c11 -O${opt} -fsanitize=undefined -fno-sanitize-recover=all -Wall -Wextra -Werror -I boot boot/user_image.c tests/native/test_user_image.c -o build/user-image-test-${opt}
            build/user-image-test-${opt}
          done
      - name: Boot ROMFS-backed independent Ring 3 user executable and reject bad code/syscalls in real QEMU
        run: python scripts/test_m5_user_loader.py
      - name: Validate M5-D1 interactive UART run parser with UBSan O0/O3
        run: |
          for opt in 0 3; do
            gcc -std=c11 -O${opt} -DHTMLK_M5_INTERACTIVE_RUN -fsanitize=undefined -fno-sanitize-recover=all -Wall -Wextra -Werror -I boot boot/serial_command.c boot/romfs.c tests/native/test_m5_run_command.c -o build/m5-run-test-${opt}
            build/m5-run-test-${opt}
          done
      - name: Verify actual M5-D1 UART run HKEX Ring3 twice, invalid paths, code mutations and shell recovery in QEMU
        run: python scripts/test_m5_interactive_run.py
      - name: Validate M5-E1 real user #GP/#PF/#UD frame policy under native UBSan O0/O3
        run: python -m unittest tests.test_user_fault_policy tests.test_console_runner -v
      - name: Run M5-E1 genuine CPL3 exceptions, reclaim, shell continuation and negative syscalls in QEMU
        run: python scripts/test_m5_user_fault_recovery.py
      - name: Guard M5-E2 actual Ring3 x2APIC timer frames with UBSan O0/O3
        run: python -m unittest tests.test_user_timeout_frame tests.test_console_runner -v
      - name: Native QEMU M5-E2 nonyielding CPL3 timeout, surviving UART shell and masked timer negatives
        run: python scripts/test_m5_user_timeout.py
      - name: M5-E3 mixed Ring3 process lifecycle and owner reuse under real QEMU x2APIC
        run: python scripts/test_m5_process_lifecycle_stress.py
      - name: M5-E3-B actual CPL3 DIV0 DEBUG INT3 recovery, one-byte trap RIP and legacy fail-stop QEMU
        run: python scripts/test_m5_user_trap_containment.py
      - name: M2-UX same beginner HTML source runs in actual native Ring3 QEMU and source mutation changes CPU output
        run: python scripts/test_htmlk_human_agent_boot.py
      - name: M2-UX2 one-command native Linux build/run, exact-source HKEX proof and genuine QEMU CPL3 execution
        run: python scripts/test_htmlk_cli_qemu.py
      - name: Explicit library bundles execute in native kernel and Ring3 QEMU
        run: python scripts/test_htmlk_bundle_qemu.py
      - name: M2-UX3 app-friendly program/main aliases execute in genuine Ring3 QEMU and source mutation alters CPU output
        run: python scripts/test_htmlk_program_main_qemu.py
      - name: Inferred local types execute on native kernel and Ring3 with source mutation
        run: python scripts/test_inferred_let_qemu.py
      - name: Entry block scopes and hygienic identifiers execute on native kernel and Ring3
        run: python scripts/test_entry_block_qemu.py
      - name: M5-F1 native HTML-derived HKEX from shared compiler, real CPL3 UART run and source provenance
        run: python scripts/test_m5_html_user.py
      - name: M5-E3-C syscall origin/owner frame guard UBSan O0 O3
        run: python -m unittest tests.test_user_syscall_policy -v
      - name: M5-E3-C genuine CPL3 malformed stack INT80 recovery and HTML user reruns in QEMU
        run: python scripts/test_m5_user_syscall_frame.py
      - name: M5-F2 Ring3 native user text copyin, invalid pointers and real UART recovery in QEMU
        run: python scripts/test_m5_html_user_text.py
      - name: M5-F3 bounded mixed Ring3 reports, overbudget syscall rejection and x2APIC QEMU recovery
        run: python scripts/test_m5_html_multi_report.py
      - name: M5-E3 guarded terminal INT80 user code-end exit and bad syscall, real QEMU
        run: python scripts/test_m5_user_syscall_eof.py
      - name: M5-E3-D real x2APIC ISR with poisoned Ring3 RSP, safe process reclaim and live HTML UART
        run: python scripts/test_m5_user_bad_irq.py
      - name: M5-F4 real QEMU HTML user exit 0/7/255, invalid exit, EOF and timer recovery
        run: python scripts/test_m5_html_exit_status.py
      - name: M5-F5 native QEMU full uint64 HTML user output, report budget and legacy rejection
        run: python scripts/test_m5_html_u64_output.py
      - name: M5-F6 signed native Ring3 reports and shared syscall budget
        run: python scripts/test_m5_html_i64_output.py
      - name: M5-E3-E genuine CPL3 UD2 with poisoned user RSP, owner-safe fault and UART recovery
        run: python scripts/test_m5_user_bad_ud_stack.py
      - name: M5-E3-F genuine owned CPL3 divide error with corrupted RSP and live UART shell
        run: python scripts/test_m5_user_bad_de_stack.py
      - name: Verify Pages live HTML user program ISO and actual QEMU serial commands
        run: |
          python scripts/build_live_site.py --out-dir build/ci-live
          python scripts/test_live_site.py --out-dir build/ci-live
          python scripts/test_live_source_mutation.py --baseline-dir build/ci-live
      - name: M5-E3-G true CPU general-protection error-code frame and owned bad user RSP recovery
        run: python scripts/test_m5_user_bad_gp_stack.py
      - name: M5-E3-H genuine CPL3 PF on TSS IST2 after poisoned user RSP, safe owner isolation
        run: python scripts/test_m5_user_bad_pf_stack.py
      - name: M5-E3-J genuine unmapped user guard-page fault and bad RSP isolation
        run: python scripts/test_m5_user_guard_page.py
      - name: M5-E3-K fresh CPL3 integer context after exit, fault and timeout
        run: python scripts/test_m5_user_entry_context.py
      - name: M5-E3-I genuine CPL3 debug and breakpoint traps with poisoned user RSP and survivor
        run: python scripts/test_m5_user_bad_trap_stack.py
      - name: M5-Web-D actual early BIOS VGA and live COM1 journal, bounded replay
        run: |
          node --check site/live/journal.mjs
          node --check site/live/live.js
          node --test scripts/test_live_boot_journal.mjs
      - name: M2-UX4 browser local HTML editor UTF-8 limit and native CPU execution parity
        run: |
          node --check site/live/editor.mjs
          node --test scripts/test_live_editor.mjs
          python scripts/test_live_editor_native.py
      - name: M5 web locally edited HTML CLI builds real Ring3 ISO and bounded source rejection
        run: python scripts/test_local_live_iso.py
      - name: Assemble standalone, non-test boot images
        run: |
          python scripts/build_boot.py --out build/html-kernel.iso
          python scripts/build_boot.py --source examples/math-kernel.html --out build/html-kernel-math.iso
          python scripts/build_boot.py --source examples/functions-kernel.html --out build/html-kernel-functions.iso
          python scripts/build_boot.py --source examples/scoped-functions-kernel.html --out build/html-kernel-scoped.iso
          python scripts/build_boot.py --source examples/else-kernel.html --out build/html-kernel-else.iso
          python scripts/build_boot.py --source examples/u32-kernel.html --out build/html-kernel-u32.iso
          python scripts/build_boot.py --source examples/signed-bits-kernel.html --out build/html-kernel-signed.iso
          python scripts/build_boot.py --source examples/while-kernel.html --out build/html-kernel-while.iso
          python scripts/build_boot.py --source examples/division-kernel.html --out build/html-kernel-division.iso
          python scripts/build_boot.py --source examples/array-kernel.html --out build/html-kernel-array.iso
          python scripts/build_boot.py --source examples/m2-exercises-kernel.html --out build/html-kernel-m2-exercises.iso
          python scripts/build_boot.py --memory-probe --out build/html-kernel-m3-memory.iso
          python scripts/build_boot.py --exception-idt --out build/html-kernel-m3-exceptions.iso
          python scripts/build_boot.py --exception-idt --paging-probe --out build/html-kernel-m3-paging.iso
          python scripts/build_boot.py --exception-idt --paging-probe --paging-recover-test --owned-frame-test --out build/html-kernel-m3-recovery.iso
          python scripts/build_boot.py --exception-idt --tss-ist --out build/html-kernel-m3-ist.iso
          python scripts/build_boot.py --exception-idt --tss-ist --paging-probe --multi-page-test --out build/html-kernel-m3-multimap.iso
          python scripts/build_boot.py --task-probe --out build/html-kernel-m4-tasks.iso
          python scripts/build_boot.py --exception-idt --preempt-probe --out build/html-kernel-m4-preempt.iso
          python scripts/build_boot.py --exception-idt --tss-ist --user-probe --out build/html-kernel-m4-user.iso
          python scripts/build_boot.py --exception-idt --tss-ist --user-isolation-probe --out build/html-kernel-m4-isolation.iso
          python scripts/build_boot.py --exception-idt --tss-ist --user-preempt-probe --out build/html-kernel-m4-user-preempt.iso
          python scripts/build_boot.py --romfs-probe --out build/html-kernel-m5-romfs.iso
          python scripts/build_boot.py --romfs-console --out build/html-kernel-m5-console.iso
          python scripts/build_boot.py --exception-idt --tss-ist --user-loader-probe --out build/html-kernel-m5-user.iso
          python scripts/build_boot.py --exception-idt --tss-ist --romfs-run-console --out build/html-kernel-m5-run.iso
          python scripts/build_boot.py --exception-idt --tss-ist --romfs-run-console --user-fault-recover --out build/html-kernel-m5-fault-recover.iso
          python scripts/build_boot.py --source examples/framebuffer-kernel.html --video-console --out build/html-kernel-video.iso
      - uses: actions/upload-artifact@v4
        with:
          name: html-kernel-os-native-iso
          path: |
            build/html-kernel.iso
            build/html-kernel.elf
            build/html-kernel-math.iso
            build/html-kernel-math.elf
            build/html-kernel-functions.iso
            build/html-kernel-functions.elf
            build/html-kernel-scoped.iso
            build/html-kernel-scoped.elf
            build/html-kernel-else.iso
            build/html-kernel-else.elf
            build/html-kernel-u32.iso
            build/html-kernel-u32.elf
            build/html-kernel-signed.iso
            build/html-kernel-signed.elf
            build/html-kernel-while.iso
            build/html-kernel-while.elf
            build/html-kernel-division.iso
            build/html-kernel-division.elf
            build/html-kernel-array.iso
            build/html-kernel-array.elf
            build/html-kernel-m2-exercises.iso
            build/html-kernel-m2-exercises.elf
            build/html-kernel-m3-memory.iso
            build/html-kernel-m3-memory.elf
            build/html-kernel-m3-exceptions.iso
            build/html-kernel-m3-exceptions.elf
            build/html-kernel-m3-paging.iso
            build/html-kernel-m3-paging.elf
            build/html-kernel-m3-recovery.iso
            build/html-kernel-m3-recovery.elf
            build/html-kernel-m3-ist.iso
            build/html-kernel-m3-ist.elf
            build/html-kernel-m3-multimap.iso
            build/html-kernel-m3-multimap.elf
            build/html-kernel-m4-tasks.iso
            build/html-kernel-m4-tasks.elf
            build/html-kernel-m4-preempt.iso
            build/html-kernel-m4-preempt.elf
            build/html-kernel-m4-user.iso
            build/html-kernel-m4-user.elf
            build/html-kernel-m4-isolation.iso
            build/html-kernel-m4-isolation.elf
            build/html-kernel-m5-romfs.iso
            build/html-kernel-m5-romfs.elf
            build/html-kernel-m5-console.iso
            build/html-kernel-m5-console.elf
            build/html-kernel-m5-user.iso
            build/html-kernel-m5-user.elf
            build/html-kernel-m5-run.iso
            build/html-kernel-m5-run.elf
            build/html-kernel-m5-fault-recover.iso
            build/html-kernel-m5-fault-recover.elf
            build/html-kernel-video.iso
            build/html-kernel-video.elf
            build/html-kernel-video-visible-screen.png
