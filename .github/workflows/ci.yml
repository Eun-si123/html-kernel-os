name: Validate prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python unit and static-site tests
        run: python -m unittest discover -s tests -v
      - name: Agent and documentation checks
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/agent_feature_map.py validate
          python scripts/roadmap.py --check
          python scripts/check_docs.py
      - name: Block private credentials in browser source
        run: |
          python3 -m unittest discover -s scripts -p 'test_verify_published_secrets.py' -v
          python3 scripts/verify_published_secrets.py site
      - name: Validate site JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/play.js
      - name: Generate freestanding C
        run: python compiler/htmlk.py examples/kernel.html --out build/kernel.c
      - name: Compile x86-64 object (not a boot image)
        run: |
          gcc -std=c11 -ffreestanding -fno-stack-protector -fno-pie -Wall -Wextra -Werror -c build/kernel.c -o build/kernel.o
          gcc -std=c11 -O2 -ffreestanding -fno-stack-protector -fno-pie -Wall -Wextra -Werror -c build/kernel.c -o build/kernel.opt.o
      - name: Compile and actually execute HTML programs in Linux userspace
        run: python scripts/test_linux.py
      - name: Differential test signed/unsigned arithmetic against Python (UBSan -O0/-O3)
        run: |
          python scripts/test_integer_oracle.py
          python scripts/test_division_oracle.py
      - name: Install real x86 boot-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso
      - name: Verify actual Limine RGB framebuffer writes and source-derived pixels in QEMU
        run: python scripts/test_video_console.py
      - name: Verify actual QEMU VGA screenshot shows kernel glyph pixels
        run: python scripts/test_video_screen.py
      - name: Boot and verify HTML-derived kernel in QEMU
        run: python scripts/test_boot.py
      - name: Verify M2 variables and control flow boot
        run: python scripts/test_language_boot.py
      - name: Verify M2 user-defined functions in Linux and native QEMU
        run: python scripts/test_functions.py
      - name: Verify scoped functions in Linux and native QEMU
        run: python scripts/test_scoped_functions.py
      - name: Verify M2 if/else branches in Linux and native QEMU
        run: python scripts/test_else.py
      - name: Verify typed u32/u64 semantics in Linux and native QEMU
        run: python scripts/test_u32.py
      - name: Verify signed integers, safe bitwise and break/continue in Linux and native QEMU
        run: python scripts/test_signed_bits.py
      - name: Verify bounded condition-driven loops in Linux and real QEMU
        run: python scripts/test_while.py
      - name: Verify safe integer division, overflow and zero-fault in Linux and QEMU
        run: python scripts/test_division.py
      - name: Verify checked arrays in Linux and actual BIOS QEMU, including OOB failures
        run: python scripts/test_arrays.py
      - name: Verify M2 five representative beginner tasks in Linux and QEMU
        run: python scripts/test_m2_gate.py
      - name: Verify M3 Limine memory-map, 16 physical page readbacks and malformed map in real QEMU
        run: python scripts/test_m3_memory.py
      - name: Verify real CPU IDT exceptions in BIOS QEMU, normal HTML and map/video composition
        run: python scripts/test_exception_idt.py
      - name: Verify private CR3 4KiB virtual map/unmap and actual post-unmap #PF in QEMU
        run: python scripts/test_paging_probe.py
      - name: Verify frame ownership and real one-shot page fault recovery in BIOS QEMU
        run: python scripts/test_paging_recovery.py
      - name: Verify genuine TSS/IST1 #DF, IST2 #PF and combined recovery boot in QEMU
        run: python scripts/test_tss_ist.py
      - name: Verify bounded 4KiB multi-page aliasing, repeated owner reuse and true revoked-page #PF in QEMU
        run: python scripts/test_multimap.py
      - name: Verify M4 real cooperative kernel tasks and rejected state transitions in QEMU
        run: python scripts/test_m4_tasks.py
      - name: Verify real M4 PIT/PIC IRQ0 pacing, APIC rejection and masked IRQ timeout
        run: python scripts/test_m4_timer.py
      - name: Verify real x2APIC timer preemption of never-yielding ring-0 tasks in QEMU
        run: python scripts/test_m4_preempt.py
      - name: Verify real M4 Ring 3 user-mode syscalls and forbidden CPU memory/IO access in QEMU
        run: python scripts/test_m4_user.py
      - name: Verify M4-C2 actual Ring 3 fault containment across distinct CR3 tasks in QEMU
        run: python scripts/test_m4_isolation.py
      - name: Verify M4-D1 real never-yielding CPL3 x2APIC preemption
        run: python scripts/test_m4_user_preempt.py
      - name: Verify M4-D2 preempted CPL3 fault containment and survivor
        run: python scripts/test_m4_user_fault_preempt.py
      - name: Validate M5-A ROMFS bounds under native UBSan O0/O3
        run: |
          for opt in 0 3; do
            gcc -std=c11 -O${opt} -fsanitize=undefined -fno-sanitize-recover=all -Wall -Wextra -Werror -I boot boot/romfs.c tests/native/test_romfs.c -o build/romfs-test-${opt}
            build/romfs-test-${opt}
          done
      - name: Boot M5-A opt-in immutable filesystem with source mutation and denial oracles
        run: python scripts/test_m5_romfs.py
      - name: Assemble standalone, non-test boot images
        run: |
          python scripts/build_boot.py --out build/html-kernel.iso
          python scripts/build_boot.py --source examples/math-kernel.html --out build/html-kernel-math.iso
          python scripts/build_boot.py --source examples/functions-kernel.html --out build/html-kernel-functions.iso
          python scripts/build_boot.py --source examples/scoped-functions-kernel.html --out build/html-kernel-scoped.iso
          python scripts/build_boot.py --source examples/else-kernel.html --out build/html-kernel-else.iso
          python scripts/build_boot.py --source examples/u32-kernel.html --out build/html-kernel-u32.iso
          python scripts/build_boot.py --source examples/signed-bits-kernel.html --out build/html-kernel-signed.iso
          python scripts/build_boot.py --source examples/while-kernel.html --out build/html-kernel-while.iso
          python scripts/build_boot.py --source examples/division-kernel.html --out build/html-kernel-division.iso
          python scripts/build_boot.py --source examples/array-kernel.html --out build/html-kernel-array.iso
          python scripts/build_boot.py --source examples/m2-exercises-kernel.html --out build/html-kernel-m2-exercises.iso
          python scripts/build_boot.py --memory-probe --out build/html-kernel-m3-memory.iso
          python scripts/build_boot.py --exception-idt --out build/html-kernel-m3-exceptions.iso
          python scripts/build_boot.py --exception-idt --paging-probe --out build/html-kernel-m3-paging.iso
          python scripts/build_boot.py --exception-idt --paging-probe --paging-recover-test --owned-frame-test --out build/html-kernel-m3-recovery.iso
          python scripts/build_boot.py --exception-idt --tss-ist --out build/html-kernel-m3-ist.iso
          python scripts/build_boot.py --exception-idt --tss-ist --paging-probe --multi-page-test --out build/html-kernel-m3-multimap.iso
          python scripts/build_boot.py --task-probe --out build/html-kernel-m4-tasks.iso
          python scripts/build_boot.py --exception-idt --preempt-probe --out build/html-kernel-m4-preempt.iso
          python scripts/build_boot.py --exception-idt --tss-ist --user-probe --out build/html-kernel-m4-user.iso
          python scripts/build_boot.py --exception-idt --tss-ist --user-isolation-probe --out build/html-kernel-m4-isolation.iso
          python scripts/build_boot.py --exception-idt --tss-ist --user-preempt-probe --out build/html-kernel-m4-user-preempt.iso
          python scripts/build_boot.py --romfs-probe --out build/html-kernel-m5-romfs.iso
          python scripts/build_boot.py --source examples/framebuffer-kernel.html --video-console --out build/html-kernel-video.iso
      - uses: actions/upload-artifact@v4
        with:
          name: html-kernel-os-native-iso
          path: |
            build/html-kernel.iso
            build/html-kernel.elf
            build/html-kernel-math.iso
            build/html-kernel-math.elf
            build/html-kernel-functions.iso
            build/html-kernel-functions.elf
            build/html-kernel-scoped.iso
            build/html-kernel-scoped.elf
            build/html-kernel-else.iso
            build/html-kernel-else.elf
            build/html-kernel-u32.iso
            build/html-kernel-u32.elf
            build/html-kernel-signed.iso
            build/html-kernel-signed.elf
            build/html-kernel-while.iso
            build/html-kernel-while.elf
            build/html-kernel-division.iso
            build/html-kernel-division.elf
            build/html-kernel-array.iso
            build/html-kernel-array.elf
            build/html-kernel-m2-exercises.iso
            build/html-kernel-m2-exercises.elf
            build/html-kernel-m3-memory.iso
            build/html-kernel-m3-memory.elf
            build/html-kernel-m3-exceptions.iso
            build/html-kernel-m3-exceptions.elf
            build/html-kernel-m3-paging.iso
            build/html-kernel-m3-paging.elf
            build/html-kernel-m3-recovery.iso
            build/html-kernel-m3-recovery.elf
            build/html-kernel-m3-ist.iso
            build/html-kernel-m3-ist.elf
            build/html-kernel-m3-multimap.iso
            build/html-kernel-m3-multimap.elf
            build/html-kernel-m4-tasks.iso
            build/html-kernel-m4-tasks.elf
            build/html-kernel-m4-preempt.iso
            build/html-kernel-m4-preempt.elf
            build/html-kernel-m4-user.iso
            build/html-kernel-m4-user.elf
            build/html-kernel-m4-isolation.iso
            build/html-kernel-m4-isolation.elf
            build/html-kernel-m5-romfs.iso
            build/html-kernel-m5-romfs.elf
            build/html-kernel-video.iso
            build/html-kernel-video.elf
            build/html-kernel-video-visible-screen.png
