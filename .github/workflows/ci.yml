name: Validate prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python unit and static-site tests
        run: python -m unittest discover -s tests -v
      - name: Agent and documentation checks
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
          python scripts/agent_feature_map.py validate
          python scripts/roadmap.py --check
          python scripts/check_docs.py
      - name: Validate site JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/play.js
      - name: Generate freestanding C
        run: python compiler/htmlk.py examples/kernel.html --out build/kernel.c
      - name: Compile x86-64 object (not a boot image)
        run: |
          gcc -std=c11 -ffreestanding -fno-stack-protector -fno-pie -Wall -Wextra -Werror -c build/kernel.c -o build/kernel.o
          gcc -std=c11 -O2 -ffreestanding -fno-stack-protector -fno-pie -Wall -Wextra -Werror -c build/kernel.c -o build/kernel.opt.o
      - name: Install real x86 boot-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso
      - name: Boot and verify HTML-derived kernel in QEMU
        run: python scripts/test_boot.py
      - name: Assemble standalone, non-test boot image
        run: python scripts/build_boot.py --out build/html-kernel.iso
      - uses: actions/upload-artifact@v4
        with:
          name: html-kernel-os-native-iso
          path: |
            build/html-kernel.iso
            build/html-kernel.elf
