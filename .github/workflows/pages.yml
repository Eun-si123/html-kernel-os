name: Publish HTML Kernel OS browser boot lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: htmlk-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native boot test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso
      - name: Verify native HTML kernel really boots
        run: python scripts/test_boot.py
      - name: Build a non-test boot ISO for visitors
        run: python scripts/build_boot.py --out build/html-kernel.iso
      - name: Assemble static Pages bundle with pinned x86-64 WebAssembly emulator
        run: |
          mkdir -p public/vendor
          cp -a site/. public/
          python scripts/fetch_browser_assets.py --dest public/vendor
          cp build/html-kernel.iso public/html-kernel.iso
          test -s public/index.html
          test -s public/play.html
          test -s public/html-kernel.iso
          test -s public/vendor/v86.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy verified image and emulator
        id: deployment
        uses: actions/deploy-pages@v4
