name: Publish HTML Kernel OS browser boot lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: htmlk-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check signed/unsigned integer calculations against Python oracle
        run: python scripts/test_integer_oracle.py
      - name: Install native boot test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso
      - name: Verify native HTML kernel really boots
        run: python scripts/test_boot.py
      - name: Verify M2 arithmetic code boots
        run: python scripts/test_language_boot.py
      - name: Verify user-defined functions run in Linux and native QEMU
        run: python scripts/test_functions.py
      - name: Verify scoped-function native behavior
        run: python scripts/test_scoped_functions.py
      - name: Verify if/else branch behavior in Linux and QEMU
        run: python scripts/test_else.py
      - name: Verify typed u32/u64 native behavior
        run: python scripts/test_u32.py
      - name: Verify signed, bitwise and loop control native behavior
        run: python scripts/test_signed_bits.py
      - name: Verify actual native RGB framebuffer image before public packaging
        run: python scripts/test_video_screen.py
      - name: Build eight non-test boot ISOs for visitors
        run: |
          python scripts/build_boot.py --out build/html-kernel.iso
          python scripts/build_boot.py --source examples/framebuffer-kernel.html --video-console --out build/html-kernel-video.iso
          python scripts/build_boot.py --source examples/math-kernel.html --out build/html-kernel-math.iso
          python scripts/build_boot.py --source examples/functions-kernel.html --out build/html-kernel-functions.iso
          python scripts/build_boot.py --source examples/scoped-functions-kernel.html --out build/html-kernel-scoped.iso
          python scripts/build_boot.py --source examples/else-kernel.html --out build/html-kernel-else.iso
          python scripts/build_boot.py --source examples/u32-kernel.html --out build/html-kernel-u32.iso
          python scripts/build_boot.py --source examples/signed-bits-kernel.html --out build/html-kernel-signed.iso
      - name: Compile actual HTML Ring3 user ISO and manifest for dedicated /live/ page
        run: python scripts/build_live_site.py --out-dir build/live-site
      - name: Verify exact published M5 ISO has genuine COM1 input and CPU user output
        run: |
          python scripts/test_live_site.py --out-dir build/live-site
          python scripts/test_live_source_mutation.py --baseline-dir build/live-site
      - name: Verify local HTML source changes native ISO and actual CPU output before Pages
        run: python scripts/test_local_live_iso.py
      - name: Assemble static Pages bundle with pinned x86-64 WebAssembly emulator
        run: |
          mkdir -p public/vendor
          cp -a site/. public/
          python scripts/fetch_browser_assets.py --cache-dir site/vendor --dest public/vendor
          cp build/html-kernel.iso public/html-kernel.iso
          cp build/html-kernel-video.iso public/html-kernel-video.iso
          cp build/html-kernel-math.iso public/html-kernel-math.iso
          cp build/html-kernel-functions.iso public/html-kernel-functions.iso
          cp build/html-kernel-scoped.iso public/html-kernel-scoped.iso
          cp build/html-kernel-else.iso public/html-kernel-else.iso
          cp build/html-kernel-u32.iso public/html-kernel-u32.iso
          cp build/html-kernel-signed.iso public/html-kernel-signed.iso
          cp build/live-site/html-kernel-live.iso public/html-kernel-live.iso
          cp build/live-site/html-kernel-live.json public/html-kernel-live.json
          mkdir -p public/examples/user-programs
          cp examples/user-programs/html-u64-report.html public/examples/user-programs/html-u64-report.html
          # Ship the exact, unchanged source files used to compile these ISOs.
          # Only these eight public-safe examples are included (not all repo files).
          mkdir -p public/examples
          cp examples/kernel.html public/examples/kernel.html
          cp examples/framebuffer-kernel.html public/examples/framebuffer-kernel.html
          cp examples/math-kernel.html public/examples/math-kernel.html
          cp examples/functions-kernel.html public/examples/functions-kernel.html
          cp examples/scoped-functions-kernel.html public/examples/scoped-functions-kernel.html
          cp examples/else-kernel.html public/examples/else-kernel.html
          cp examples/u32-kernel.html public/examples/u32-kernel.html
          cp examples/signed-bits-kernel.html public/examples/signed-bits-kernel.html
          test -s public/index.html
          test -s public/play.html
          test -s public/html-kernel.iso
          test -s public/html-kernel-video.iso
          test -s public/html-kernel-math.iso
          test -s public/html-kernel-functions.iso
          test -s public/html-kernel-scoped.iso
          test -s public/html-kernel-else.iso
          test -s public/html-kernel-u32.iso
          test -s public/html-kernel-signed.iso
          test -s public/html-kernel-live.iso
          test -s public/html-kernel-live.json
          test -s public/live/index.html
          test -s public/live/live.js
          test -s public/live/live.css
          test -s public/examples/user-programs/html-u64-report.html
          test -s public/examples/kernel.html
          test -s public/examples/framebuffer-kernel.html
          test -s public/examples/math-kernel.html
          test -s public/examples/functions-kernel.html
          test -s public/examples/scoped-functions-kernel.html
          test -s public/examples/else-kernel.html
          test -s public/examples/u32-kernel.html
          test -s public/examples/signed-bits-kernel.html
          test -s public/vendor/v86.wasm
      - name: Block private credentials in generated public Pages artifact
        run: |
          python3 -m unittest discover -s scripts -p 'test_verify_published_secrets.py' -v
          python3 scripts/verify_published_secrets.py public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy verified image and emulator
        id: deployment
        uses: actions/deploy-pages@v4
