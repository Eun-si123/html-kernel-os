name: Publish HTML Kernel OS browser boot lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: htmlk-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native boot test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso
      - name: Verify native HTML kernel really boots
        run: python scripts/test_boot.py
      - name: Verify M2 arithmetic code boots
        run: python scripts/test_language_boot.py
      - name: Verify user-defined functions run in Linux and native QEMU
        run: python scripts/test_functions.py
      - name: Verify scoped-function native behavior
        run: python scripts/test_scoped_functions.py
      - name: Verify if/else branch behavior in Linux and QEMU
        run: python scripts/test_else.py
      - name: Build five non-test boot ISOs for visitors
        run: |
          python scripts/build_boot.py --out build/html-kernel.iso
          python scripts/build_boot.py --source examples/math-kernel.html --out build/html-kernel-math.iso
          python scripts/build_boot.py --source examples/functions-kernel.html --out build/html-kernel-functions.iso
          python scripts/build_boot.py --source examples/scoped-functions-kernel.html --out build/html-kernel-scoped.iso
          python scripts/build_boot.py --source examples/else-kernel.html --out build/html-kernel-else.iso
      - name: Assemble static Pages bundle with pinned x86-64 WebAssembly emulator
        run: |
          mkdir -p public/vendor
          cp -a site/. public/
          python scripts/fetch_browser_assets.py --cache-dir site/vendor --dest public/vendor
          cp build/html-kernel.iso public/html-kernel.iso
          cp build/html-kernel-math.iso public/html-kernel-math.iso
          cp build/html-kernel-functions.iso public/html-kernel-functions.iso
          cp build/html-kernel-scoped.iso public/html-kernel-scoped.iso
          cp build/html-kernel-else.iso public/html-kernel-else.iso
          test -s public/index.html
          test -s public/play.html
          test -s public/html-kernel.iso
          test -s public/html-kernel-math.iso
          test -s public/html-kernel-functions.iso
          test -s public/html-kernel-scoped.iso
          test -s public/html-kernel-else.iso
          test -s public/vendor/v86.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy verified image and emulator
        id: deployment
        uses: actions/deploy-pages@v4
